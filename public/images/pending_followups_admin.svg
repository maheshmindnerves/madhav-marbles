<svg width="220" height="260" viewBox="0 0 220 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="220" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5D78A"/>
      <stop offset="1" stop-color="#F2D084"/>
    </linearGradient>

    <filter id="shadow" x="0" y="0" width="220" height="260" filterUnits="userSpaceOnUse">
      <feDropShadow dx="4" dy="6" stdDeviation="6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="220" height="260" rx="36" fill="url(#bgGradient)"/>

  <!-- Icon -->
  <g filter="url(#shadow)">
    <!-- Outer square -->
    <rect x="58" y="84" width="104" height="104" rx="12"
          stroke="#001B2E"
          stroke-width="10"
          fill="none"/>

    <!-- Arrow line -->
    <path d="M86 154L132 108"
          stroke="#001B2E"
          stroke-width="10"
          stroke-linecap="round"/>

    <!-- Arrow head -->
    <path d="M114 108H132V126"
          stroke="#001B2E"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Cross line -->
    <path d="M94 112L150 158"
          stroke="#001B2E"
          stroke-width="10"
          stroke-linecap="round"/>
  </g>
</svg>