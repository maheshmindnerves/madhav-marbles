<!-- <app-filter></app-filter> -->


<div class="row header">
   <div class="col-md-12 col-sm-12 col-12 text-end">
      <!-- <span class="cursor-pointer h6" (click)="submitRequest()"> Submit Request &nbsp;&nbsp;<i
            class="fa fa-angle-right "></i></span> -->
      <button class="btn btn-warning submit-btn" (click)="submitRequest()">
         Submit Request <i class="fa fa-angle-right ms-1"></i>
      </button>

   </div>
</div>
<div class="row y-scroll-card">
   @for (item of items(); track item.productId) {
   <div class="col-md-4 col-sm-6 col-12">
      <div class="card custom-card">
         <div class="card-body">
            <img class="card-img-top" [src]="'data:image/png;base64,' + item.image_Path" alt="Card image cap"
               (click)="onClickImage(item)">
            <div class="main-title">{{item.name + item.item_Code }}</div>
            <div>
               <label class="text-white">Category : </label><span class="sub-title ms-2">{{item.category_Name}}</span>

               <button type="button" class="btn btn-outline-light view-details" (click)="openDialog(item)">
                  <i class="fa fa-eye" aria-hidden="true"></i> &nbsp;&nbsp;View Details
               </button>
            </div>
            <div><label class="text-white"> Sub Category : </label><span
                  class="sub-title ms-2">{{item.subCategory_name}}</span></div>
         </div>
      </div>
   </div>
   }
</div>
