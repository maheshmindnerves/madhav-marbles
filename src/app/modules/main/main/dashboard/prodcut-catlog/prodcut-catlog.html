<div class="row">
    <div class="col-md-6 col-sm-6 col-6 custom-header"><mat-icon class="text-white"
            (click)="back()"><mat-icon>keyboard_arrow_left</mat-icon></mat-icon></div>
    <div class="col-md-6 col-sm-6 col-6 custom-header text-end"><mat-icon class="text-white"
            (click)="addProduct()">add_box</mat-icon></div>
</div>
<div class="row">
    @for (item of items(); track item.item_Code) {
    <div class="col-md-4 col-sm-6 col-12">
        <div class="card p-2 mt-2">
            <div class="row">
                <div class="col-md-5 col-sm-5 col-5 border-right-gray">
                    <div class="pt-1">Item Name:</div>
                    <div class="pt-1">Item Code:</div>
                    <div class="pt-1">category:</div>
                </div>
                <div class="col-md-7 col-sm-7 col-7 text-end">
                    <div class="link pt-1">{{item.name}}</div>
                    <div class="link pt-1">{{item.item_Code}}</div>
                    <div class="link pt-1">{{item.category_name}}</div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12 col-sm-12 col-12 text-end pt-2">
                    <span class="me-2" (click)="onClickEdit(item)"> <mat-icon class="edit-list text-primary" >edit</mat-icon></span>
                    <span>Add Specification</span>
                    <span class="ms-2"><mat-icon class="edit-list text-success" (click)="onClickSpecification(item)"> list_alt</mat-icon></span>
                </div>
            </div>

        </div>
    </div>
    }
</div>
