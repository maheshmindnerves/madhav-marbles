<div class="row">
    <div class="col-md-12 col-sm-12 col-12 custom-header"><mat-icon class="text-white"
            (click)="back()"><mat-icon>keyboard_arrow_left</mat-icon></mat-icon></div>
</div>
<div class="row">
    @for (item of items(); track item.id) {
    <div class="col-md-4 col-sm-6 col-12">
        <div class="card p-2 mt-2">
            <div class="row">
                <div class="col-md-5 col-sm-5 col-5 border-right-gray">
                    <div class="pt-1">Parent Item Name:</div>
                    <div class="pt-1">Color:</div>
                    <div class="pt-1">Dimension:</div>
                    <div class="pt-1">Thickness:</div>
                </div>
                <div class="col-md-7 col-sm-7 col-7 text-end">
                    <div class="link pt-1">{{item.name}}</div>
                    <div class="link pt-1">{{item.Color}}</div>
                    <div class="link pt-1">{{item.Dimension}}</div>
                    <div class="link pt-1">{{item.Thickness}}</div>
                </div>

                <div class="col-md-12 col-sm-12 col-12">
                    <label class="fw-normal">Specification</label>
                    <textarea class="form-control" disabled>{{item.Specification}}</textarea>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-md-6 col-sm-6 col-6">
                    <button type="button" class="btn btn-warning" (click)="onClickViewGallery(item)">View Gallery</button>
                </div>
                <div class="col-md-6 col-sm-6 col-6 text-end">
                    <button type="button" class="btn btn-success" (click)="onClickProductGallary(item)">New Product Gallery</button>
                </div>
                <div class="col-md-12 col-sm-12 col-12 text-end mt-2">
                    <button type="button" class="btn btn-outline-secondary">Edit <mat-icon
                            class="edit-list">edit</mat-icon></button>
                </div>
            </div>
        </div>
    </div>
    }
</div>
