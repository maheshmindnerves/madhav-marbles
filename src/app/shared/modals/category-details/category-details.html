<div class="pt-2 p-3 overflow-hidden">
    <span mat-dialog-close class="btn-close-custom"></span>
    <div id="myCarousel" class="carousel slide">
        <div class="carousel-inner">
            <h5 class="smoke-color pb-2">{{categroyDetails.title}}</h5>
            @for (item of categroyDetails.data; track item.id; let i = $index) {
            <div class="carousel-item" [class.active]="i === 0">
                <img [src]="'data:image/png;base64,' + item.Image_Path" class="card-img-top"
                    (click)="onClickImage(item)">
                <div class="col-md-12 col-sm-12 col-12 mt-2 mb-3 mt-4">
                    <!--  <h5 class="smoke-color mb-2">Description</h5> -->
                    <div class="desc-detials">
                        {{item.Image_Description}}
                    </div>
                </div>
                <div class="col-md-12 col-sm-12 col-12 hr-line"></div>
                <div class="col-md-12 col-sm-12 col-12 mt-3">
                    <h5 style="color: #d3d1d1;">Specification</h5>
                    <div class="desc-detials-2">
                        {{item.Specification}}
                    </div>
                </div>
                <div class="col-md-12 col-sm-12 col-12 mt-3">
                    <h5 style="color: #d3d1d1;">Additional Information</h5>
                    <div class="row">
                        <div class="col-md-4 col-sm-4 col-5 text-white">ORIGEN :</div>
                        <div class="col-md-8 col-sm-8 col-7 smoke-color">Quartz</div>
                        <div class="col-md-4 col-sm-4 col-5 text-white">THICKNESSES :</div>
                        <div class="col-md-8 col-sm-8 col-7 smoke-color">{{item.Thickness}}</div>
                        <div class="col-md-4 col-sm-4 col-5 text-white">DIMENSIONS :</div>
                        <div class="col-md-8 col-sm-8 col-7 smoke-color">{{item.Dimension}}</div>
                        <div class="col-md-4 col-sm-4 col-5 text-white">Color :</div>
                        <div class="col-md-8 col-sm-8 col-7 smoke-color">{{item.color}}</div>
                    </div>
                </div>
            </div>


            }
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>
</div>
