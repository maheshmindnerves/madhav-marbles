<div class="user-details-container">
  <div class="modal-header d-flex justify-content-between align-items-center pb-3 border-bottom">
    <h4 class="modal-title m-0 d-flex align-items-center gap-2">
      <i class="fa fa-user-circle text-primary"></i> Profile Details
    </h4>
    <button type="button" class="btn-close" (click)="close()" aria-label="Close"></button>
  </div>
  
  <div class="modal-body py-4">
    <div class="detail-item mb-3">
      <div class="label text-muted small text-uppercase fw-bold">User Name</div>
      <div class="value fs-5 text-dark">{{ userName() }}</div>
    </div>
    
    <div class="detail-item mb-3">
      <div class="label text-muted small text-uppercase fw-bold">Email ID</div>
      <div class="value fs-5 text-dark">{{ userEmail() }}</div>
    </div>
    
    <div class="detail-item mb-3">
      <div class="label text-muted small text-uppercase fw-bold">Mobile Number</div>
      <div class="value fs-5 text-dark">{{ userMobile() }}</div>
    </div>
    
    <div class="detail-item mb-3">
      <div class="label text-muted small text-uppercase fw-bold">Address</div>
      <div class="value fs-5 text-dark">{{ userAddress() }}</div>
    </div>
  </div>
  
  <div class="modal-footer pt-3 border-top d-flex justify-content-end">
    <button type="button" class="btn btn-primary rounded-pill px-4" (click)="close()">Close</button>
  </div>
</div>
