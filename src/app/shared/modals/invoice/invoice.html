<div class="modal-header bg-light">
    <h5 class="modal-title">Invoice</h5>
    <button type="button" class="btn-close" mat-dialog-close></button>
</div>
<div class="bg-light p-3">
    <div class="row">
        <div class="col-md-12 col-sm-12 col-12">Invoice Number: <b>{{data.invoice}}</b></div>
        <div class="col-md-12 col-sm-12 col-12 mt-2">Invoice Date: <b>{{date}}</b></div>
        <div class="col-md-12 col-sm-12 col-12 mt-3">
            <label class="fw-normal">Remark</label>
            <textarea class="form-control" [formControl]="remark"></textarea>
        </div>
        <div class="col-md-12 col-sm-12 col-12 mt-3 text-center">
            <button class="btn btn-success btn-sm" (click)="onClickSubmit()"
                [disabled]="remark.value === ''">Submit</button>
        </div>
    </div>
</div>
