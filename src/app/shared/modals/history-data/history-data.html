<div class="header">
  <h5 class="fw-bold text-dark">{{ dialogTitle }}</h5>
  <span mat-dialog-close class="btn-close-custom"></span>
</div>
<div class="dialog-body p-3">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-2 gap-2">
    <div class="flex-grow-1" style="max-width: 250px; min-width: 150px;">
      <input 
        type="text" 
        class="form-control form-control-sm w-100" 
        placeholder="Search..." 
        (input)="onSearch($event)"
      />
    </div>
    <button class="btn btn-success btn-sm d-flex align-items-center gap-1" (click)="exportToCsv()">
      <i class="fa fa-download"></i> Export CSV
    </button>
  </div>
  <ag-grid-angular
    style="width: 100%; height: 350px;"
    class="ag-theme-quartz"
    theme="legacy"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    [pagination]="pagination"
    [paginationPageSize]="paginationPageSize"
    [paginationPageSizeSelector]="paginationPageSizeSelector"
    (gridReady)="onGridReady($event)"
    (firstDataRendered)="onFirstDataRendered($event)"
    (gridSizeChanged)="onGridSizeChanged($event)"
  >
  </ag-grid-angular>
</div>
